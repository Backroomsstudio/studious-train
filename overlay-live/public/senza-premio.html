<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Senza premio · Backrooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Grenze+Gotisch:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/overlay.css">
  <link rel="stylesheet" href="/css/senza-premio.css">
</head>
<body class="verticale sp">
  <!-- Elementi grafici: gradienti, punta e corona come nell'overlay della gara, icone dei social disegnate da noi -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-cromo" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.44" stop-color="#a3a9b1"/>
        <stop offset="0.52" stop-color="#3b3f46"/>
        <stop offset="0.68" stop-color="#eceff2"/>
        <stop offset="1" stop-color="#8f959d"/>
      </linearGradient>
      <linearGradient id="g-oro" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fffbe0"/>
        <stop offset="0.35" stop-color="#ffd54a"/>
        <stop offset="0.6" stop-color="#e09a12"/>
        <stop offset="0.8" stop-color="#ffd659"/>
        <stop offset="1" stop-color="#b87808"/>
      </linearGradient>
      <symbol id="punta" viewBox="0 0 100 100">
        <path d="M50 0C53 35 65 47 100 50 65 53 53 65 50 100 47 65 35 53 0 50 35 47 47 35 50 0Z"/>
      </symbol>
      <symbol id="corona" viewBox="0 0 64 50">
        <path d="M5 39 8 15 21 28 32 7 43 28 56 15 59 39Z" fill="url(#g-oro)" stroke="#5c3a00" stroke-width="2" stroke-linejoin="round"/>
        <rect x="6" y="39" width="52" height="8" rx="2" fill="url(#g-oro)" stroke="#5c3a00" stroke-width="2"/>
        <circle cx="8" cy="12" r="4" fill="#fff3b8" stroke="#5c3a00" stroke-width="1.6"/>
        <circle cx="32" cy="5" r="4.4" fill="#fff3b8" stroke="#5c3a00" stroke-width="1.6"/>
        <circle cx="56" cy="12" r="4" fill="#fff3b8" stroke="#5c3a00" stroke-width="1.6"/>
        <circle cx="32" cy="31" r="3.4" fill="#ff4fd8" stroke="#5c3a00" stroke-width="1.4"/>
      </symbol>
      <symbol id="ic-nero" viewBox="0 0 24 24"><path d="M9 17.5V5.5l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/></symbol>
      <symbol id="ic-instagram" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor" stroke="none"/></symbol>
      <symbol id="ic-tiktok" viewBox="0 0 24 24"><path d="M14 3.5v11a4 4 0 1 1-4-4"/><path d="M14 3.5c.6 2.6 2.5 4.4 5 4.8"/></symbol>
      <symbol id="ic-twitch" viewBox="0 0 24 24"><path d="M4.5 3.5h15v10.5l-4.5 4.5h-4l-3 3v-3h-3.5z"/><path d="M11 8v4.5M15.5 8v4.5"/></symbol>
      <symbol id="ic-kick" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M4 3h5v5h2V6h2V3h7v6h-2v2h-2v2h2v2h2v6h-7v-3h-2v-2H9v5H4z"/></symbol>
      <symbol id="ic-youtube" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.2l5 2.8-5 2.8z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="ic-spotify" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M7 9.6c3.4-1 7-.7 10 1M7.6 12.8c2.9-.8 5.6-.5 8 .9M8.3 15.8c2.2-.6 4.2-.4 5.9.6"/></symbol>
      <symbol id="ic-whatsapp" viewBox="0 0 24 24"><path d="M4 20.5l1.4-4.1A8.5 8.5 0 1 1 8.6 19.3z"/><path d="M9.2 8.6c.2 2.9 2.6 5.6 5.9 6.2l1.3-1.4-1.9-1-.9.8a5 5 0 0 1-2.4-2.4l.8-.9-1-1.9z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="ic-sito" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></symbol>
      <symbol id="ic-microfono" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></symbol>
      <symbol id="ic-cuffie" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="5" height="7" rx="2"/><rect x="16" y="14" width="5" height="7" rx="2"/></symbol>
    </defs>
  </svg>

  <div class="palco">
    <!-- Solo con ?anteprima=1: al posto della camera dello studio -->
    <div class="sp-finta-camera" aria-hidden="true">Camera</div>
    <div class="sp-filo-camera" data-widget="barra"><i class="sp-luce"></i></div>

    <!-- BANNER: «Mandaci la tua musica!», come si partecipa e dove -->
    <section class="pannello sp-banner" data-widget="banner">
      <div class="sp-alone"></div>
      <div class="sp-oro"></div>
      <div class="sp-logo sx"><div class="sp-logo-alone"></div><img src="/assets/logo-br.png" alt=""></div>
      <div class="sp-logo dx"><div class="sp-logo-alone"></div><img src="/assets/logo-br.png" alt=""></div>
      <div class="sp-sopra" id="sp-sopra-riga"><i></i><span id="sp-sopra"></span><i></i></div>
      <div class="sp-titolo cromo luccica" id="sp-titolo"></div>
      <div class="sp-divisore"><i></i><span class="sp-divisore-centro" id="sp-divisore-centro"><svg class="punta"><use href="#punta"/></svg></span><i></i></div>
      <div class="sp-pillola-riga"><span class="sp-pillola" id="sp-pillola"></span></div>
      <div class="sp-link" id="sp-link"></div>
      <div class="sp-sottolinea"></div>
      <div class="sp-schizzi" id="sp-schizzi"></div>
    </section>

    <!-- SCHEDA «ORA IN ASCOLTO» (e spot dello studio): sale da dietro la barra -->
    <div class="sp-scheda-zona" data-widget="scheda">
      <section class="pannello sp-scheda" id="sp-scheda">
        <div class="sp-scheda-testi">
          <div class="sp-scheda-testa">
            <i class="onda"><b></b><b></b><b></b><b></b></i>
            <img class="sp-mini-logo" src="/assets/logo-br.png" alt="">
            <span id="sp-scheda-sopra">Ora in ascolto</span>
            <svg class="sp-corona"><use href="#corona"/></svg>
            <span class="tier" id="sp-scheda-tier" hidden></span>
          </div>
          <div class="sp-scheda-titolo" id="sp-scheda-titolo"></div>
          <div class="sp-scheda-artista" id="sp-scheda-artista"></div>
        </div>
        <div class="sp-vinile">
          <div class="sp-disco"><div class="sp-etichetta-disco"><img src="/assets/logo-br.png" alt=""></div></div>
          <div class="sp-vinile-luce"></div>
        </div>
      </section>
      <div class="sp-scintille" id="sp-scintille"></div>
    </div>

    <!-- BARRA CHE SCORRE: social, link, traccia in ascolto -->
    <section class="sp-barra" data-widget="barra">
      <div class="sp-finestra"><div class="sp-nastro" id="sp-nastro"></div></div>
      <div class="sp-barra-filo alto"><i class="sp-luce"></i><i class="sp-filo-oro" id="sp-filo-oro"></i></div>
      <div class="sp-barra-filo basso"></div>
      <div class="sp-barra-logo sx bordo-cromo"><img src="/assets/logo-br.png" alt=""></div>
      <div class="sp-barra-logo dx bordo-cromo"><img src="/assets/logo-br.png" alt=""></div>
    </section>

    <!-- Solo con ?guide=1: zona visibile sui telefoni, zone coperte dall'app TikTok, camera e commenti -->
    <div class="guide" aria-hidden="true">
      <div class="guida-taglio sx"></div>
      <div class="guida-taglio dx"></div>
      <div class="guida-ui alto">Nome live, spettatori, classifiche TikTok</div>
      <div class="guida-ui basso">Pulsanti TikTok</div>
      <div class="guida-camera">Camera (sfondo dello studio)</div>
      <div class="guida-commenti">Commenti sui telefoni (indicativo)</div>
    </div>
  </div>

  <script type="module" src="/js/senza-premio.js"></script>
</body>
</html>
