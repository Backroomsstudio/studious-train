<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Live session in studio · Backrooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/overlay.css">
  <link rel="stylesheet" href="/css/senza-premio.css">
  <link rel="stylesheet" href="/css/studio.css">
</head>
<body class="verticale st">
  <!-- Elementi grafici: gradienti, punta e icone dei social disegnate da noi (come nel layout senza premio) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-cromo" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.44" stop-color="#a3a9b1"/>
        <stop offset="0.52" stop-color="#3b3f46"/>
        <stop offset="0.68" stop-color="#eceff2"/>
        <stop offset="1" stop-color="#8f959d"/>
      </linearGradient>
      <linearGradient id="g-oro" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fffbe0"/>
        <stop offset="0.35" stop-color="#ffd54a"/>
        <stop offset="0.6" stop-color="#e09a12"/>
        <stop offset="0.8" stop-color="#ffd659"/>
        <stop offset="1" stop-color="#b87808"/>
      </linearGradient>
      <symbol id="punta" viewBox="0 0 100 100">
        <path d="M50 0C53 35 65 47 100 50 65 53 53 65 50 100 47 65 35 53 0 50 35 47 47 35 50 0Z"/>
      </symbol>
      <symbol id="ic-nero" viewBox="0 0 24 24"><path d="M9 17.5V5.5l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/></symbol>
      <symbol id="ic-instagram" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor" stroke="none"/></symbol>
      <symbol id="ic-tiktok" viewBox="0 0 24 24"><path d="M14 3.5v11a4 4 0 1 1-4-4"/><path d="M14 3.5c.6 2.6 2.5 4.4 5 4.8"/></symbol>
      <symbol id="ic-twitch" viewBox="0 0 24 24"><path d="M4.5 3.5h15v10.5l-4.5 4.5h-4l-3 3v-3h-3.5z"/><path d="M11 8v4.5M15.5 8v4.5"/></symbol>
      <symbol id="ic-kick" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M4 3h5v5h2V6h2V3h7v6h-2v2h-2v2h2v2h2v6h-7v-3h-2v-2H9v5H4z"/></symbol>
      <symbol id="ic-youtube" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.2l5 2.8-5 2.8z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="ic-spotify" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M7 9.6c3.4-1 7-.7 10 1M7.6 12.8c2.9-.8 5.6-.5 8 .9M8.3 15.8c2.2-.6 4.2-.4 5.9.6"/></symbol>
      <symbol id="ic-whatsapp" viewBox="0 0 24 24"><path d="M4 20.5l1.4-4.1A8.5 8.5 0 1 1 8.6 19.3z"/><path d="M9.2 8.6c.2 2.9 2.6 5.6 5.9 6.2l1.3-1.4-1.9-1-.9.8a5 5 0 0 1-2.4-2.4l.8-.9-1-1.9z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="ic-dm" viewBox="0 0 24 24"><path d="M21 3.5 3 10.6l7.2 2.7 2.7 7.2z"/><path d="M21 3.5 10.2 13.3"/></symbol>
      <symbol id="ic-sito" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></symbol>
      <symbol id="ic-microfono" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></symbol>
      <symbol id="ic-cuffie" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="5" height="7" rx="2"/><rect x="16" y="14" width="5" height="7" rx="2"/></symbol>
    </defs>
  </svg>

  <div class="palco">
    <!-- Solo con ?anteprima=1: al posto delle tre camere della scena (fonico, artista, schermo della DAW) -->
    <div class="st-finto fonico" aria-hidden="true"><span>Fonico</span></div>
    <div class="st-finto artista" aria-hidden="true"><span>Artista</span></div>
    <div class="st-finto daw" aria-hidden="true"><span>DAW · FL Studio</span></div>

    <!-- STRISCIA TRA FONICO E ARTISTA: targa 3D con nome e Instagram dell'artista, scritti dalla regia -->
    <section class="st-nome" data-parte="targa">
      <div class="st-fascia">
        <i class="st-trama"></i>
        <div class="st-filo alto"><i class="sp-luce"></i></div>
        <div class="st-filo basso"><i class="sp-luce"></i></div>
      </div>
      <div class="st-targa" id="st-targa">
        <div class="st-targa-giro">
          <div class="st-targa-corpo">
            <div class="st-targa-faccia st-vetro">
              <div class="st-luce"></div>
              <div class="st-moneta sx" data-moneta></div>
              <div class="st-moneta dx" data-moneta style="--ritardo:-3.5s"></div>
              <div class="st-targa-testi">
                <div class="st-nome-artista cromo luccica" id="st-artista"></div>
                <div class="st-ig" id="st-ig">
                  <span class="st-ig-icona"><svg><use href="#ic-instagram"/></svg></span>
                  <span class="st-ig-testo" id="st-ig-testo"></span>
                </div>
              </div>
            </div>
            <div class="st-etichetta" id="st-etichetta-riga"><i class="st-rec"></i><span id="st-etichetta"></span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- COMPARSE DELLO STUDIO: salgono dalla barra come un pannello incernierato, una alla volta, mute -->
    <div class="st-comparsa-zona" data-parte="comparse">
      <section class="st-comparsa st-vetro" id="st-comparsa">
        <div class="st-luce"></div>
        <div class="st-medaglia"><svg id="st-comparsa-icona"><use href="#ic-microfono"/></svg></div>
        <div class="st-comparsa-testi">
          <div class="st-comparsa-sopra" id="st-comparsa-sopra"></div>
          <div class="st-comparsa-titolo" id="st-comparsa-titolo"></div>
          <div class="st-comparsa-sotto" id="st-comparsa-sotto"></div>
        </div>
        <div class="st-moneta" data-moneta style="--ritardo:-1.5s"></div>
      </section>
    </div>

    <!-- STRISCIA TRA ARTISTA E DAW: i nostri social che scorrono (stessa barra del layout senza premio, in 3D) -->
    <section class="sp-barra st-barra" data-parte="barra">
      <div class="sp-finestra"><div class="sp-nastro" id="sp-nastro"></div></div>
      <i class="st-barra-vetro"></i>
      <div class="sp-barra-filo alto"><i class="sp-luce"></i><i class="sp-filo-oro" id="sp-filo-oro"></i></div>
      <div class="sp-barra-filo basso st-filo-basso"><i class="sp-luce"></i></div>
      <div class="st-moneta st-barra-moneta sx" data-moneta style="--ritardo:-5s"></div>
      <div class="st-moneta st-barra-moneta dx" data-moneta style="--ritardo:-1s"></div>
    </section>

    <!-- Solo con ?guide=1: zona visibile sui telefoni, zone coperte dall'app TikTok, i tre schermi -->
    <div class="guide" aria-hidden="true">
      <div class="guida-taglio sx"></div>
      <div class="guida-taglio dx"></div>
      <div class="guida-ui alto">Nome live, spettatori, classifiche TikTok</div>
      <div class="guida-ui basso">Pulsanti TikTok</div>
      <div class="guida-schermo fonico">Camera fonico · 0 → 640</div>
      <div class="guida-schermo artista">Camera artista · 716 → 1296</div>
      <div class="guida-schermo daw">Schermo DAW · 1388 → 1920</div>
    </div>
  </div>

  <script type="module" src="/js/studio.js"></script>
</body>
</html>
